name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from git tags
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          # fail if pixi.lock is out of sync with pixi.toml
          locked: true
      - run: pixi run lint
      - run: pixi run format-check

  test:
    name: test (${{ matrix.env }})
    strategy:
      fail-fast: false
      matrix:
        env: [py311, py312, py313, py314]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: ${{ matrix.env }}
          locked: true
      - run: pixi run -e ${{ matrix.env }} test

  build:
    name: build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          locked: true
      - run: pixi run build
      - name: install the wheel and check the resolved version
        run: pixi run smoke
